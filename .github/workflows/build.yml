name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug and release APKs
        run: gradle assembleDebug assembleRelease -Pvc=$((100 + ${{ github.run_number }})) --no-daemon

      - name: Name the APKs
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk HiringDesk-${{ github.run_number }}-debug.apk
          cp app/build/outputs/apk/release/app-release.apk HiringDesk-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: HiringDesk-${{ github.run_number }}
          path: |
            HiringDesk-${{ github.run_number }}.apk
            HiringDesk-${{ github.run_number }}-debug.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Hiring Desk build ${{ github.run_number }}
          body: Install HiringDesk-${{ github.run_number }}.apk (or the -debug.apk). Each build updates the previous one and keeps your data.
          files: |
            HiringDesk-${{ github.run_number }}.apk
            HiringDesk-${{ github.run_number }}-debug.apk
          make_latest: true
